<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradAllenCsk" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>

    <!-- Polished SS304 stainless steel gradient -->
    <linearGradient id="allenCskMetalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="15%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="88%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <radialGradient id="allenFlatTop" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="85%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </radialGradient>

    <linearGradient id="coneBevelAllen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="80%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="hexSocketShadowAllenCsk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="75%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="threadToothAllenCsk" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="25%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#94a3b8"/>
      <stop offset="85%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <filter id="softShadowAllenCsk" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>
  </defs>

  <!-- Clean Studio Background -->
  <rect width="500" height="500" fill="url(#bgGradAllenCsk)" rx="16"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>
  <path d="M 250 25 L 250 475 M 25 250 L 475 250" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Soft Contact Drop Shadow -->
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#0f172a" fill-opacity="0.14" filter="url(#softShadowAllenCsk)"/>

  <!-- Technical Head / Drive Inset Badge (Top Right) -->
  <g transform="translate(370, 30)">
    <circle cx="45" cy="45" r="42" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="45" cy="45" r="36" fill="url(#allenFlatTop)" stroke="#64748b" stroke-width="1"/>
    <!-- Hexagon Socket Inset -->
    <polygon points="45,26 62,35 62,55 45,64 28,55 28,35" fill="url(#hexSocketShadowAllenCsk)" stroke="#020617" stroke-width="1.2"/>
    <text x="45" y="102" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="0.5">ALLEN CSK</text>
  </g>

  <!-- Spec Tag (Top Left) -->
  <g transform="translate(25, 30)">
    <rect width="118" height="24" rx="4" fill="#0f172a" fill-opacity="0.06" stroke="#cbd5e1" stroke-width="1"/>
    <text x="59" y="16" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#0284c7">DIN 7991 / ISO 10642</text>
    <rect y="28" width="82" height="20" rx="3" fill="#0284c7" fill-opacity="0.1"/>
    <text x="41" y="42" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#0369a1">SS304 STEEL</text>
  </g>

  <!-- MAIN SCREW (Allen Countersunk CSK Screw) -->
  <!-- 1. Shank Core Body -->
  <rect x="216" y="145" width="68" height="255" fill="url(#allenCskMetalGrad)" stroke="#475569" stroke-width="1.5"/>

  <!-- 2. Metric Machine Threads -->
  <g stroke="#334155" stroke-width="1">
    <polygon points="213,170 287,182 287,192 213,180" fill="url(#threadToothAllenCsk)"/>
    <polygon points="213,190 287,202 287,212 213,200" fill="url(#threadToothAllenCsk)"/>
    <polygon points="213,210 287,222 287,232 213,220" fill="url(#threadToothAllenCsk)"/>
    <polygon points="213,230 287,242 287,252 213,240" fill="url(#threadToothAllenCsk)"/>
    <polygon points="213,250 287,262 287,272 213,260" fill="url(#threadToothAllenCsk)"/>
    <polygon points="213,270 287,282 287,292 213,280" fill="url(#threadToothAllenCsk)"/>
    <polygon points="213,290 287,302 287,312 213,300" fill="url(#threadToothAllenCsk)"/>
    <polygon points="213,310 287,322 287,332 213,320" fill="url(#threadToothAllenCsk)"/>
    <polygon points="213,330 287,342 287,352 213,340" fill="url(#threadToothAllenCsk)"/>
    <polygon points="213,350 287,362 287,372 213,360" fill="url(#threadToothAllenCsk)"/>
    <polygon points="213,370 287,382 287,392 213,380" fill="url(#threadToothAllenCsk)"/>
  </g>

  <!-- 3. Machine Screw Blunt Lead Chamfer -->
  <polygon points="216,400 284,400 274,420 226,420" fill="url(#allenCskMetalGrad)" stroke="#475569" stroke-width="1.5"/>
  <ellipse cx="250" cy="420" rx="24" ry="4" fill="#64748b"/>

  <!-- 4. Countersunk (CSK) 90° Inverted Cone Head -->
  <polygon points="175,95 325,95 284,145 216,145" fill="url(#coneBevelAllen)" stroke="#334155" stroke-width="2"/>
  <ellipse cx="250" cy="95" rx="75" ry="16" fill="url(#allenFlatTop)" stroke="#475569" stroke-width="1.5"/>

  <!-- 5. Internal Hex (Allen) Socket in Flat Countersunk Top -->
  <g transform="translate(250, 95)">
    <polygon points="0,-14 20,-7 20,7 0,14 -20,7 -20,-7" fill="url(#hexSocketShadowAllenCsk)" stroke="#020617" stroke-width="1.5"/>
    <polygon points="0,-10 15,-5 15,5 0,10 -15,5 -15,-5" fill="#020617" opacity="0.8"/>
    <!-- Socket rim bevel highlight -->
    <path d="M -20,-7 L 0,-14 L 20,-7" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.95"/>
  </g>

  <!-- Reflection lines -->
  <line x1="205" y1="102" x2="225" y2="142" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="230" y1="145" x2="230" y2="398" stroke="#ffffff" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Bottom Label Bar -->
  <g transform="translate(0, 460)">
    <text x="250" y="15" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e293b" letter-spacing="0.5">ALLEN COUNTERSUNK (CSK) SCREW • DIN 7991 / HEX DRIVE</text>
  </g>
</svg>
