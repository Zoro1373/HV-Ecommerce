<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradDrywall" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>

    <!-- Matte black phosphate finish gradient -->
    <linearGradient id="blackPhosphateGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="20%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="90%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Bugle head trumpet curve gradient -->
    <linearGradient id="bugleBevelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="25%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="80%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <radialGradient id="bugleTopDisc" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="80%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <linearGradient id="drywallPhillipsDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Deep twin-lead thread tooth -->
    <linearGradient id="dwThreadTooth" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="25%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="80%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <filter id="softShadowDrywall" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>
  </defs>

  <!-- Clean Studio Background -->
  <rect width="500" height="500" fill="url(#bgGradDrywall)" rx="16"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>
  <path d="M 250 25 L 250 475 M 25 250 L 475 250" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Soft Contact Drop Shadow -->
  <ellipse cx="250" cy="445" rx="75" ry="12" fill="#0f172a" fill-opacity="0.16" filter="url(#softShadowDrywall)"/>

  <!-- Technical Head / Drive Inset Badge (Top Right) -->
  <g transform="translate(370, 30)">
    <circle cx="45" cy="45" r="42" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <circle cx="45" cy="45" r="36" fill="url(#bugleTopDisc)" stroke="#334155" stroke-width="1"/>
    <!-- Cross / Phillips Inset -->
    <g fill="url(#drywallPhillipsDark)" stroke="#020617" stroke-width="0.8">
      <rect x="41" y="23" width="8" height="44" rx="1.5"/>
      <rect x="23" y="41" width="44" height="8" rx="1.5"/>
      <polygon points="41,37 45,45 49,37 49,53 45,45 41,53" fill="#020617"/>
    </g>
    <text x="45" y="102" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#334155" letter-spacing="0.5">BUGLE HEAD #2</text>
  </g>

  <!-- Spec Tag (Top Left) -->
  <g transform="translate(25, 30)">
    <rect width="115" height="24" rx="4" fill="#0f172a" fill-opacity="0.06" stroke="#cbd5e1" stroke-width="1"/>
    <text x="57" y="16" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#ea580c">DIN 18182 / ASTM</text>
    <rect y="28" width="102" height="20" rx="3" fill="#ea580c" fill-opacity="0.1"/>
    <text x="51" y="42" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#c2410c">BLACK PHOSPHATE</text>
  </g>

  <!-- MAIN SCREW (Drywall / Gypsum Bugle Head) -->
  <!-- 1. Shank Core Body -->
  <polygon points="220,150 280,150 274,380 226,380" fill="url(#blackPhosphateGrad)" stroke="#0f172a" stroke-width="1.5"/>

  <!-- 2. Twin-Lead High-Pitch Drywall Threads -->
  <g stroke="#020617" stroke-width="1">
    <polygon points="206,172 294,188 294,200 206,184" fill="url(#dwThreadTooth)"/>
    <polygon points="206,206 294,222 294,234 206,218" fill="url(#dwThreadTooth)"/>
    <polygon points="206,240 294,256 294,268 206,252" fill="url(#dwThreadTooth)"/>
    <polygon points="206,274 294,290 294,302 206,286" fill="url(#dwThreadTooth)"/>
    <polygon points="206,308 294,324 294,336 206,320" fill="url(#dwThreadTooth)"/>
    <polygon points="208,342 292,358 292,370 208,354" fill="url(#dwThreadTooth)"/>
    <!-- Tapering leads -->
    <polygon points="216,374 284,388 284,398 216,384" fill="url(#dwThreadTooth)"/>
    <polygon points="226,400 274,410 274,418 226,408" fill="url(#dwThreadTooth)"/>
  </g>

  <!-- 3. Needle Piercing Sharp Point -->
  <polygon points="226,380 274,380 250,436" fill="url(#blackPhosphateGrad)" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="250" cy="436" r="1.5" fill="#020617"/>

  <!-- 4. Signature Bugle Head (curved trumpet flared profile) -->
  <path d="M 170 95 C 190 95, 220 120, 220 150 L 280 150 C 280 120, 310 95, 330 95 Z" fill="url(#bugleBevelGrad)" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Flat top disc of bugle head -->
  <ellipse cx="250" cy="95" rx="80" ry="16" fill="url(#bugleTopDisc)" stroke="#334155" stroke-width="1.5"/>

  <!-- 5. Cross (Phillips #2) Recess -->
  <g transform="translate(250, 95)">
    <polygon points="-5,-26 5,-26 4,26 -4,26" fill="url(#drywallPhillipsDark)" stroke="#020617" stroke-width="1.2"/>
    <polygon points="-26,-5 26,-5 26,4 -26,4" fill="url(#drywallPhillipsDark)" stroke="#020617" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="4" fill="#020617"/>
    <line x1="-26" y1="-5" x2="26" y2="-5" stroke="#64748b" stroke-width="1"/>
    <line x1="-5" y1="-26" x2="-5" y2="26" stroke="#64748b" stroke-width="1"/>
  </g>

  <!-- Satin phosphate highlight curvature -->
  <path d="M 190 102 C 205 106, 218 122, 224 146" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="232" y1="150" x2="232" y2="380" stroke="#64748b" stroke-width="2.5" stroke-opacity="0.5"/>

  <!-- Bottom Label Bar -->
  <g transform="translate(0, 460)">
    <text x="250" y="15" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e293b" letter-spacing="0.5">DRYWALL / GYPSUM SCREWS • BLACK PHOSPHATED</text>
  </g>
</svg>
