<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background studio gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>

    <!-- Stainless steel gradient -->
    <linearGradient id="chhdMetalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="18%" stop-color="#f8fafc"/>
      <stop offset="42%" stop-color="#cbd5e1"/>
      <stop offset="68%" stop-color="#64748b"/>
      <stop offset="88%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Head top face bevel gradient -->
    <radialGradient id="topBevel" cx="42%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="75%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>

    <!-- Slot recess interior shadow -->
    <linearGradient id="slotShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Thread tooth pattern gradient -->
    <linearGradient id="threadTooth" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="25%" stop-color="#f1f5f9"/>
      <stop offset="55%" stop-color="#94a3b8"/>
      <stop offset="85%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Filter for soft studio contact shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>
  </defs>

  <!-- Clean Studio Background -->
  <rect width="500" height="500" fill="url(#bgGrad)" rx="16"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>
  <path d="M 250 25 L 250 475 M 25 250 L 475 250" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Soft Contact Drop Shadow -->
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#0f172a" fill-opacity="0.14" filter="url(#softShadow)"/>

  <!-- Technical Head / Drive Inset Badge (Top Right) -->
  <g transform="translate(370, 30)">
    <circle cx="45" cy="45" r="42" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="45" cy="45" r="36" fill="url(#topBevel)" stroke="#64748b" stroke-width="1"/>
    <!-- Slot in inset -->
    <rect x="18" y="41" width="54" height="8" rx="2" fill="url(#slotShadow)" stroke="#0f172a" stroke-width="1"/>
    <text x="45" y="102" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="0.5">SLOTTED DRIVE</text>
  </g>

  <!-- Spec Tag (Top Left) -->
  <g transform="translate(25, 30)">
    <rect width="110" height="24" rx="4" fill="#0f172a" fill-opacity="0.06" stroke="#cbd5e1" stroke-width="1"/>
    <text x="55" y="16" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#2563eb">IS / ISO METRIC</text>
    <rect y="28" width="82" height="20" rx="3" fill="#2563eb" fill-opacity="0.1"/>
    <text x="41" y="42" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#1d4ed8">SS304 STEEL</text>
  </g>

  <!-- MAIN SCREW (Slotted Cheese Head CHHD) -->
  <!-- 1. Shank Core Body -->
  <rect x="215" y="150" width="70" height="250" fill="url(#chhdMetalGrad)" stroke="#475569" stroke-width="1.5"/>

  <!-- 2. Metric Machine Threads (Detailed helical crests) -->
  <g stroke="#334155" stroke-width="1">
    <!-- Thread ridges -->
    <polygon points="212,175 288,187 288,197 212,185" fill="url(#threadTooth)"/>
    <polygon points="212,195 288,207 288,217 212,205" fill="url(#threadTooth)"/>
    <polygon points="212,215 288,227 288,237 212,225" fill="url(#threadTooth)"/>
    <polygon points="212,235 288,247 288,257 212,245" fill="url(#threadTooth)"/>
    <polygon points="212,255 288,267 288,277 212,265" fill="url(#threadTooth)"/>
    <polygon points="212,275 288,287 288,297 212,285" fill="url(#threadTooth)"/>
    <polygon points="212,295 288,307 288,317 212,305" fill="url(#threadTooth)"/>
    <polygon points="212,315 288,327 288,337 212,325" fill="url(#threadTooth)"/>
    <polygon points="212,335 288,347 288,357 212,345" fill="url(#threadTooth)"/>
    <polygon points="212,355 288,367 288,377 212,365" fill="url(#threadTooth)"/>
    <polygon points="212,375 288,387 288,397 212,385" fill="url(#threadTooth)"/>
  </g>

  <!-- 3. Machine Screw Chamfered Tip (Blunt lead-in per ISO) -->
  <polygon points="215,400 285,400 274,420 226,420" fill="url(#chhdMetalGrad)" stroke="#475569" stroke-width="1.5"/>
  <ellipse cx="250" cy="420" rx="24" ry="4" fill="#64748b"/>

  <!-- 4. Cylindrical Cheese Head (Tall profile with flat bottom and flat top) -->
  <!-- Under-head fillet transition -->
  <path d="M 215 152 Q 215 145 190 145 L 310 145 Q 285 145 285 152 Z" fill="#64748b"/>
  <!-- Tall cheese head cylinder -->
  <rect x="180" y="80" width="140" height="65" rx="3" fill="url(#chhdMetalGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Head Top Bevel & Flat Top Face -->
  <ellipse cx="250" cy="80" rx="70" ry="16" fill="url(#topBevel)" stroke="#475569" stroke-width="1.5"/>

  <!-- 5. Precision Slotted Drive Groove -->
  <g>
    <!-- Slot cavity -->
    <path d="M 200 78 L 300 78 L 300 98 L 200 98 Z" fill="url(#slotShadow)" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Slot highlight edges -->
    <line x1="200" y1="78" x2="300" y2="78" stroke="#ffffff" stroke-width="1" stroke-opacity="0.8"/>
    <line x1="200" y1="98" x2="300" y2="98" stroke="#64748b" stroke-width="1"/>
  </g>

  <!-- Head highlight reflection line -->
  <line x1="210" y1="83" x2="210" y2="142" stroke="#ffffff" stroke-width="3" stroke-opacity="0.6"/>
  <!-- Shank highlight reflection line -->
  <line x1="230" y1="150" x2="230" y2="400" stroke="#ffffff" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Bottom Label Bar -->
  <g transform="translate(0, 460)">
    <text x="250" y="15" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e293b" letter-spacing="0.5">SLOTTED CHHD • CHEESE HEAD MACHINE SCREW</text>
  </g>
</svg>
