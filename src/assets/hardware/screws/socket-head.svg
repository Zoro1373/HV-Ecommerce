<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradSocket" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>

    <!-- SS316 Marine Grade metallic steel gradient -->
    <linearGradient id="ss316MetalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="15%" stop-color="#f8fafc"/>
      <stop offset="38%" stop-color="#cbd5e1"/>
      <stop offset="68%" stop-color="#475569"/>
      <stop offset="88%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Head knurled cylinder gradient -->
    <linearGradient id="knurlGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="20%" stop-color="#cbd5e1"/>
      <stop offset="45%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="90%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <radialGradient id="socketTopBevel" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="75%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>

    <!-- Deep internal Hex Allen socket shadow -->
    <linearGradient id="hexSocketShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="75%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="threadToothSocket" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="25%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#94a3b8"/>
      <stop offset="85%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <filter id="softShadowSocket" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>
  </defs>

  <!-- Clean Studio Background -->
  <rect width="500" height="500" fill="url(#bgGradSocket)" rx="16"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>
  <path d="M 250 25 L 250 475 M 25 250 L 475 250" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Soft Contact Drop Shadow -->
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#0f172a" fill-opacity="0.14" filter="url(#softShadowSocket)"/>

  <!-- Technical Head / Drive Inset Badge (Top Right) -->
  <g transform="translate(370, 30)">
    <circle cx="45" cy="45" r="42" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="45" cy="45" r="36" fill="url(#socketTopBevel)" stroke="#64748b" stroke-width="1"/>
    <!-- Hexagon Socket Inset -->
    <polygon points="45,24 63,34 63,56 45,66 27,56 27,34" fill="url(#hexSocketShadow)" stroke="#020617" stroke-width="1.2"/>
    <text x="45" y="102" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="0.5">HEX (ALLEN)</text>
  </g>

  <!-- Spec Tag (Top Left) -->
  <g transform="translate(25, 30)">
    <rect width="118" height="24" rx="4" fill="#0f172a" fill-opacity="0.06" stroke="#cbd5e1" stroke-width="1"/>
    <text x="59" y="16" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#0284c7">DIN 912 / ISO 4762</text>
    <rect y="28" width="94" height="20" rx="3" fill="#0284c7" fill-opacity="0.1"/>
    <text x="47" y="42" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#0369a1">SS316 MARINE</text>
  </g>

  <!-- MAIN SCREW (Socket Head Cap Screw) -->
  <!-- 1. Shank Core Body (Unthreaded upper + Threaded lower) -->
  <rect x="215" y="152" width="70" height="248" fill="url(#ss316MetalGrad)" stroke="#475569" stroke-width="1.5"/>

  <!-- 2. Metric Machine Threads (Detailed helical crests) -->
  <g stroke="#334155" stroke-width="1">
    <polygon points="212,185 288,197 288,207 212,195" fill="url(#threadToothSocket)"/>
    <polygon points="212,205 288,217 288,227 212,215" fill="url(#threadToothSocket)"/>
    <polygon points="212,225 288,237 288,247 212,235" fill="url(#threadToothSocket)"/>
    <polygon points="212,245 288,257 288,267 212,255" fill="url(#threadToothSocket)"/>
    <polygon points="212,265 288,277 288,287 212,275" fill="url(#threadToothSocket)"/>
    <polygon points="212,285 288,297 288,307 212,295" fill="url(#threadToothSocket)"/>
    <polygon points="212,305 288,317 288,327 212,315" fill="url(#threadToothSocket)"/>
    <polygon points="212,325 288,337 288,347 212,335" fill="url(#threadToothSocket)"/>
    <polygon points="212,345 288,357 288,367 212,355" fill="url(#threadToothSocket)"/>
    <polygon points="212,365 288,377 288,387 212,375" fill="url(#threadToothSocket)"/>
    <polygon points="212,385 288,397 288,407 212,395" fill="url(#threadToothSocket)"/>
  </g>

  <!-- 3. Machine Screw Chamfered Tip -->
  <polygon points="215,410 285,410 274,428 226,428" fill="url(#ss316MetalGrad)" stroke="#475569" stroke-width="1.5"/>
  <ellipse cx="250" cy="428" rx="24" ry="4" fill="#64748b"/>

  <!-- 4. Cylindrical Knurled Socket Head -->
  <!-- Main cylinder -->
  <rect x="180" y="82" width="140" height="70" rx="3" fill="url(#knurlGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Knurling vertical ridges pattern -->
  <g stroke="#334155" stroke-width="1.2" opacity="0.65">
    <line x1="188" y1="85" x2="188" y2="150"/>
    <line x1="196" y1="85" x2="196" y2="150"/>
    <line x1="204" y1="85" x2="204" y2="150"/>
    <line x1="212" y1="85" x2="212" y2="150"/>
    <line x1="220" y1="85" x2="220" y2="150"/>
    <line x1="228" y1="85" x2="228" y2="150"/>
    <line x1="236" y1="85" x2="236" y2="150"/>
    <line x1="244" y1="85" x2="244" y2="150"/>
    <line x1="252" y1="85" x2="252" y2="150"/>
    <line x1="260" y1="85" x2="260" y2="150"/>
    <line x1="268" y1="85" x2="268" y2="150"/>
    <line x1="276" y1="85" x2="276" y2="150"/>
    <line x1="284" y1="85" x2="284" y2="150"/>
    <line x1="292" y1="85" x2="292" y2="150"/>
    <line x1="300" y1="85" x2="300" y2="150"/>
    <line x1="308" y1="85" x2="308" y2="150"/>
  </g>

  <!-- Top Bevel & Flat Top Face -->
  <ellipse cx="250" cy="82" rx="70" ry="16" fill="url(#socketTopBevel)" stroke="#475569" stroke-width="1.5"/>

  <!-- 5. Internal Hex Socket Recess (Deep 3D perspective hex) -->
  <g transform="translate(250, 82)">
    <!-- Outer hex -->
    <polygon points="0,-12 24,-6 24,6 0,12 -24,6 -24,-6" fill="url(#hexSocketShadow)" stroke="#020617" stroke-width="1.5"/>
    <!-- Deep internal hex facet lines -->
    <polygon points="0,-8 18,-4 18,4 0,8 -18,4 -18,-4" fill="#020617" opacity="0.8"/>
    <!-- Socket rim bevel highlight -->
    <path d="M -24,-6 L 0,-12 L 24,-6" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.9"/>
  </g>

  <!-- Head highlight reflection line -->
  <line x1="205" y1="85" x2="205" y2="150" stroke="#ffffff" stroke-width="3" stroke-opacity="0.6"/>
  <!-- Shank highlight line -->
  <line x1="230" y1="152" x2="230" y2="408" stroke="#ffffff" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Bottom Label Bar -->
  <g transform="translate(0, 460)">
    <text x="250" y="15" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e293b" letter-spacing="0.5">SOCKET HEAD CAP SCREW • DIN 912 / HEX (ALLEN)</text>
  </g>
</svg>
