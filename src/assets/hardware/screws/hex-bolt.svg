<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradHexBolt" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>

    <!-- Polished SS304 stainless steel gradient -->
    <linearGradient id="hexBoltMetalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="15%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="88%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Hex bolt facets gradient -->
    <linearGradient id="facetCenter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="35%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="60%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="facetRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="60%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <radialGradient id="hexBoltTopBevel" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="75%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>

    <linearGradient id="threadToothHexBolt" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="25%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#94a3b8"/>
      <stop offset="85%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <filter id="softShadowHexBolt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>
  </defs>

  <!-- Clean Studio Background -->
  <rect width="500" height="500" fill="url(#bgGradHexBolt)" rx="16"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>
  <path d="M 250 25 L 250 475 M 25 250 L 475 250" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Soft Contact Drop Shadow -->
  <ellipse cx="250" cy="445" rx="85" ry="14" fill="#0f172a" fill-opacity="0.14" filter="url(#softShadowHexBolt)"/>

  <!-- Technical Head / Drive Inset Badge (Top Right) -->
  <g transform="translate(370, 30)">
    <circle cx="45" cy="45" r="42" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="45" cy="45" r="36" fill="url(#hexBoltTopBevel)" stroke="#64748b" stroke-width="1"/>
    <!-- Outer Hexagon Inset -->
    <polygon points="45,20 66,32 66,58 45,70 24,58 24,32" fill="url(#facetCenter)" stroke="#334155" stroke-width="1.5"/>
    <text x="45" y="102" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="0.5">EXTERNAL HEX</text>
  </g>

  <!-- Spec Tag (Top Left) -->
  <g transform="translate(25, 30)">
    <rect width="118" height="24" rx="4" fill="#0f172a" fill-opacity="0.06" stroke="#cbd5e1" stroke-width="1"/>
    <text x="59" y="16" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#0284c7">DIN 933 / ISO 4017</text>
    <rect y="28" width="94" height="20" rx="3" fill="#0284c7" fill-opacity="0.1"/>
    <text x="47" y="42" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#0369a1">SS304 A2-70</text>
  </g>

  <!-- MAIN BOLT (Hexagonal Machine Bolt) -->
  <!-- 1. Shank Core Body -->
  <rect x="215" y="152" width="70" height="248" fill="url(#hexBoltMetalGrad)" stroke="#475569" stroke-width="1.5"/>

  <!-- 2. Metric Machine Threads -->
  <g stroke="#334155" stroke-width="1">
    <polygon points="212,185 288,197 288,207 212,195" fill="url(#threadToothHexBolt)"/>
    <polygon points="212,205 288,217 288,227 212,215" fill="url(#threadToothHexBolt)"/>
    <polygon points="212,225 288,237 288,247 212,235" fill="url(#threadToothHexBolt)"/>
    <polygon points="212,245 288,257 288,267 212,255" fill="url(#threadToothHexBolt)"/>
    <polygon points="212,265 288,277 288,287 212,275" fill="url(#threadToothHexBolt)"/>
    <polygon points="212,285 288,297 288,307 212,295" fill="url(#threadToothHexBolt)"/>
    <polygon points="212,305 288,317 288,327 212,315" fill="url(#threadToothHexBolt)"/>
    <polygon points="212,325 288,337 288,347 212,335" fill="url(#threadToothHexBolt)"/>
    <polygon points="212,345 288,357 288,367 212,355" fill="url(#threadToothHexBolt)"/>
    <polygon points="212,365 288,377 288,387 212,375" fill="url(#threadToothHexBolt)"/>
    <polygon points="212,385 288,397 288,407 212,395" fill="url(#threadToothHexBolt)"/>
  </g>

  <!-- 3. Machine Screw Chamfered Tip -->
  <polygon points="215,410 285,410 274,428 226,428" fill="url(#hexBoltMetalGrad)" stroke="#475569" stroke-width="1.5"/>
  <ellipse cx="250" cy="428" rx="24" ry="4" fill="#64748b"/>

  <!-- 4. External Hex Head with 3 Visible Facets in perspective -->
  <g>
    <!-- Left Facet -->
    <polygon points="175,102 215,108 215,150 175,144" fill="url(#facetLeft)" stroke="#334155" stroke-width="1.5"/>
    <!-- Center Facet -->
    <polygon points="215,108 285,108 285,150 215,150" fill="url(#facetCenter)" stroke="#334155" stroke-width="1.5"/>
    <!-- Right Facet -->
    <polygon points="285,108 325,102 325,144 285,150" fill="url(#facetRight)" stroke="#334155" stroke-width="1.5"/>

    <!-- Head Top Chamfer Arc & Bevel -->
    <ellipse cx="250" cy="100" rx="75" ry="16" fill="url(#hexBoltTopBevel)" stroke="#475569" stroke-width="1.5"/>
    <!-- Grade Stamp on Top of Bolt Head -->
    <text x="250" y="103" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#334155" letter-spacing="1">A2-70</text>
  </g>

  <!-- Facet corner vertical highlight -->
  <line x1="215" y1="108" x2="215" y2="150" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8"/>
  <!-- Shank highlight line -->
  <line x1="230" y1="152" x2="230" y2="408" stroke="#ffffff" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Bottom Label Bar -->
  <g transform="translate(0, 460)">
    <text x="250" y="15" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e293b" letter-spacing="0.5">STAINLESS STEEL HEX BOLT • DIN 933 / EXTERNAL HEX</text>
  </g>
</svg>
