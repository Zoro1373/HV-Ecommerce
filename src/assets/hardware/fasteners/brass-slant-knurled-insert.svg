<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradBrass" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <linearGradient id="brassGradBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="20%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#a16207"/>
      <stop offset="90%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <linearGradient id="brassDarkKnurl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <linearGradient id="brassTopFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="insertThreadBore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="softShadowBrass" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bgGradBrass)" rx="16"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>
  <path d="M 250 25 L 250 475 M 25 250 L 475 250" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Soft Contact Drop Shadow -->
  <ellipse cx="250" cy="405" rx="110" ry="22" fill="#0f172a" fill-opacity="0.18" filter="url(#softShadowBrass)"/>

  <!-- Spec Tag (Top Left) -->
  <g transform="translate(25, 30)">
    <rect width="130" height="24" rx="4" fill="#0f172a" fill-opacity="0.06" stroke="#cbd5e1" stroke-width="1"/>
    <text x="65" y="16" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#d97706">3D PRINT HEAT-SET</text>
  </g>

  <!-- 3D Print Knurl Badge (Top Right) -->
  <g transform="translate(370, 30)">
    <circle cx="45" cy="45" r="42" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <rect x="28" y="24" width="34" height="42" rx="3" fill="#fef08a" stroke="#a16207" stroke-width="1.5"/>
    <path d="M 32 30 L 58 40 M 32 40 L 58 50 M 32 50 L 58 60 M 58 30 L 32 40 M 58 40 L 32 50 M 58 50 L 32 60" stroke="#854d0e" stroke-width="1.5"/>
    <text x="45" y="102" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#a16207" letter-spacing="0.5">SLANT KNURL</text>
  </g>

  <!-- Brass Slant Knurled Heat-Set Insert 3D Cylinder -->
  <g transform="translate(250, 240)">
    <!-- Bottom Pilot Chamfer -->
    <path d="M -70 115 L -60 145 C -60 162, 60 162, 60 145 L 70 115 Z" fill="url(#brassGradBody)" stroke="#854d0e" stroke-width="1.5"/>

    <!-- Lower Knurled Band (Angle Slant Left-to-Right) -->
    <rect x="-80" y="55" width="160" height="60" fill="url(#brassGradBody)" stroke="#713f12" stroke-width="1.5"/>
    <!-- Left-Slanted Knurl Ridges -->
    <g stroke="#713f12" stroke-width="2.5" opacity="0.8">
      <line x1="-70" y1="55" x2="-45" y2="115"/>
      <line x1="-45" y1="55" x2="-20" y2="115"/>
      <line x1="-20" y1="55" x2="5" y2="115"/>
      <line x1="5" y1="55" x2="30" y2="115"/>
      <line x1="30" y1="55" x2="55" y2="115"/>
      <line x1="55" y1="55" x2="75" y2="105"/>
    </g>
    <!-- Right-Slanted Cross Hatching Knurls -->
    <g stroke="#fef08a" stroke-width="1.5" opacity="0.6">
      <line x1="-45" y1="115" x2="-70" y2="55"/>
      <line x1="-20" y1="115" x2="-45" y2="55"/>
      <line x1="5" y1="115" x2="-20" y2="55"/>
      <line x1="30" y1="115" x2="5" y2="55"/>
      <line x1="55" y1="115" x2="30" y2="55"/>
    </g>

    <!-- Center Plastic Relief Undercut Groove (Flow Reservoir) -->
    <rect x="-74" y="35" width="148" height="20" fill="url(#brassDarkKnurl)" stroke="#854d0e" stroke-width="1.2"/>
    <ellipse cx="0" cy="35" rx="74" ry="12" fill="none" stroke="#fef08a" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Upper Knurled Band (Opposite Angle Slant Right-to-Left) -->
    <rect x="-80" y="-30" width="160" height="65" fill="url(#brassGradBody)" stroke="#713f12" stroke-width="1.5"/>
    <g stroke="#713f12" stroke-width="2.5" opacity="0.8">
      <line x1="-75" y1="-20" x2="-50" y2="35"/>
      <line x1="-50" y1="-30" x2="-25" y2="35"/>
      <line x1="-25" y1="-30" x2="0" y2="35"/>
      <line x1="0" y1="-30" x2="25" y2="35"/>
      <line x1="25" y1="-30" x2="50" y2="35"/>
      <line x1="50" y1="-30" x2="75" y2="30"/>
    </g>

    <!-- Top Flange Face -->
    <ellipse cx="0" cy="-30" rx="80" ry="32" fill="url(#brassTopFace)" stroke="#fef08a" stroke-width="2"/>
    <ellipse cx="0" cy="-30" rx="76" ry="30" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8"/>

    <!-- Internal Metric Threaded Bore -->
    <ellipse cx="0" cy="-30" rx="46" ry="19" fill="url(#insertThreadBore)" stroke="#854d0e" stroke-width="2"/>

    <!-- Precision Internal Threads -->
    <path d="M -42 -30 Q 0 -17 42 -30" fill="none" stroke="#ca8a04" stroke-width="2.5"/>
    <path d="M -38 -24 Q 0 -11 38 -24" fill="none" stroke="#fef08a" stroke-width="2"/>
    <path d="M -34 -18 Q 0 -5 34 -18" fill="none" stroke="#854d0e" stroke-width="2.5"/>
  </g>

  <!-- Tag (Bottom) -->
  <g transform="translate(250, 455)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0f172a" letter-spacing="1">3D PRINTING BRASS SLANT KNURLED INSERT</text>
    <text x="0" y="18" text-anchor="middle" font-family="monospace" font-size="10" fill="#a16207">HEAT-SET EMBEDDING FOR PLA / PETG / ABS / NYLON</text>
  </g>
</svg>