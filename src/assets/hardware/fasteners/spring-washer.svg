<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradSpring" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <linearGradient id="springSteelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#cbd5e1"/>
      <stop offset="45%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="splitCutFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="softShadowSpring" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bgGradSpring)" rx="16"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>
  <path d="M 250 25 L 250 475 M 25 250 L 475 250" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Soft Contact Drop Shadow -->
  <ellipse cx="250" cy="385" rx="145" ry="32" fill="#0f172a" fill-opacity="0.16" filter="url(#softShadowSpring)"/>

  <!-- Spec Tag (Top Left) -->
  <g transform="translate(25, 30)">
    <rect width="90" height="24" rx="4" fill="#0f172a" fill-opacity="0.06" stroke="#cbd5e1" stroke-width="1"/>
    <text x="45" y="16" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#0284c7">DIN 127B</text>
  </g>

  <!-- Spring Lock Badge (Top Right) -->
  <g transform="translate(370, 30)">
    <circle cx="45" cy="45" r="42" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 30 55 C 20 40, 25 25, 45 25 C 65 25, 70 40, 60 55 C 50 65, 40 65, 35 55" fill="none" stroke="#475569" stroke-width="4"/>
    <path d="M 30 55 L 30 65" stroke="#0284c7" stroke-width="3"/>
    <text x="45" y="102" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="0.5">SPRING LOCK</text>
  </g>

  <!-- Helical Split Spring Washer 3D Geometry -->
  <g transform="translate(250, 240)">
    <!-- Lower Ring Arc Section (Lower Split End) -->
    <path d="M -15 65 C -80 65, -135 30, -135 -10 C -135 -60, -50 -75, 20 -70" fill="none" stroke="url(#springSteelGrad)" stroke-width="42" stroke-linecap="butt"/>

    <!-- Upper Helical Overlap Section with Raised End -->
    <path d="M 0 -70 C 80 -65, 135 -30, 135 10 C 135 60, 50 78, 15 82" fill="none" stroke="url(#springSteelGrad)" stroke-width="42" stroke-linecap="butt"/>

    <!-- Sharp Cut Split Gap Faces -->
    <!-- Upper raised cut face -->
    <polygon points="15,61 36,61 36,103 15,103" fill="url(#splitCutFace)" stroke="#334155" stroke-width="1.5"/>
    <line x1="15" y1="61" x2="36" y2="61" stroke="#ffffff" stroke-width="2"/>

    <!-- Lower recessed cut face -->
    <polygon points="-15,44 -36,44 -36,86 -15,86" fill="url(#splitCutFace)" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Helical Sheen Highlights -->
    <path d="M -130 -10 C -130 -50, -50 -65, 15 -62" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.7"/>
    <path d="M 130 10 C 130 50, 60 70, 20 74" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8"/>
  </g>

  <!-- Dimensions Tag (Bottom) -->
  <g transform="translate(250, 455)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0f172a" letter-spacing="1">SPRING TEMPERED SS304 WASHER</text>
    <text x="0" y="18" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">HELICAL SPLIT VIBRATION RESISTANCE</text>
  </g>
</svg>