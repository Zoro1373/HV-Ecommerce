<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradPlainWasher" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <linearGradient id="washerMetalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#cbd5e1"/>
      <stop offset="45%" stop-color="#f1f5f9"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="90%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="washerSideGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="softShadowWasher" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bgGradPlainWasher)" rx="16"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>
  <path d="M 250 25 L 250 475 M 25 250 L 475 250" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Soft Contact Drop Shadow -->
  <ellipse cx="250" cy="380" rx="145" ry="32" fill="#0f172a" fill-opacity="0.14" filter="url(#softShadowWasher)"/>

  <!-- Spec Tag (Top Left) -->
  <g transform="translate(25, 30)">
    <rect width="135" height="24" rx="4" fill="#0f172a" fill-opacity="0.06" stroke="#cbd5e1" stroke-width="1"/>
    <text x="67" y="16" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#0284c7">DIN 125A / ISO 7089</text>
  </g>

  <!-- Type Badge (Top Right) -->
  <g transform="translate(370, 30)">
    <circle cx="45" cy="45" r="42" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <circle cx="45" cy="45" r="14" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="45" y="102" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="0.5">PLAIN FLAT</text>
  </g>

  <!-- 3D Isometric View Plain Washer -->
  <g transform="translate(250, 240)">
    <!-- Lower Edge Thickness (3D Height) -->
    <path d="M -140 10 C -140 75, 140 75, 140 10 L 140 28 C 140 93, -140 93, -140 28 Z" fill="url(#washerSideGrad)" stroke="#475569" stroke-width="1.5"/>

    <!-- Inner Bore Thickness -->
    <path d="M -60 10 C -60 45, 60 45, 60 10 L 60 28 C 60 63, -60 63, -60 28 Z" fill="#334155" stroke="#1e293b" stroke-width="1"/>

    <!-- Top Washer Face Ring (Compound Path with Outer and Inner Oval) -->
    <path d="M -140 10 C -140 -55, 140 -55, 140 10 C 140 75, -140 75, -140 10 Z M -60 10 C -60 45, 60 45, 60 10 C 60 -25, -60 -25, -60 10 Z" fill="url(#washerMetalGrad)" stroke="#cbd5e1" stroke-width="1.5" fill-rule="evenodd"/>

    <!-- Outer Chamfer Bevel Ring Highlight -->
    <ellipse cx="0" cy="10" rx="136" ry="60" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8"/>
    <!-- Inner Bore Chamfer Highlight -->
    <ellipse cx="0" cy="10" rx="63" ry="28" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.7"/>

    <!-- Circular Brushed Sheen Effect Rays -->
    <ellipse cx="0" cy="10" rx="100" ry="44" fill="none" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="8,6" stroke-opacity="0.5"/>
  </g>

  <!-- Tag (Bottom) -->
  <g transform="translate(250, 455)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0f172a" letter-spacing="1">SS304 PLAIN METRIC WASHER</text>
    <text x="0" y="18" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">LOAD DISTRIBUTION &amp; SURFACE PROTECTION</text>
  </g>
</svg>