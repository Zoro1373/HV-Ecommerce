<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradFemBerg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <linearGradient id="femBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="25%" stop-color="#1e293b"/>
      <stop offset="80%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldPinLead" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="softShadowFem" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bgGradFemBerg)" rx="16"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>
  <path d="M 250 25 L 250 475 M 25 250 L 475 250" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Soft Contact Drop Shadow -->
  <ellipse cx="250" cy="415" rx="155" ry="18" fill="#0f172a" fill-opacity="0.16" filter="url(#softShadowFem)"/>

  <!-- Spec Tag (Top Left) -->
  <g transform="translate(25, 30)">
    <rect width="135" height="24" rx="4" fill="#0f172a" fill-opacity="0.06" stroke="#cbd5e1" stroke-width="1"/>
    <text x="67" y="16" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#0284c7">2.54mm PITCH / 40P</text>
  </g>

  <!-- Component Badge (Top Right) -->
  <g transform="translate(370, 30)">
    <circle cx="45" cy="45" r="42" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="22" y="32" width="46" height="26" rx="2" fill="#1e293b"/>
    <rect x="28" y="40" width="6" height="10" fill="#020617"/>
    <rect x="38" y="40" width="6" height="10" fill="#020617"/>
    <rect x="48" y="40" width="6" height="10" fill="#020617"/>
    <rect x="58" y="40" width="6" height="10" fill="#020617"/>
    <text x="45" y="102" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="0.5">FEMALE SOCKET</text>
  </g>

  <!-- 40-Pin Female Berg Strip Socket Housing -->
  <g transform="translate(250, 240) rotate(-14)">
    <!-- Lower Solder Tail Pins (Extending 3.2mm Below Housing) -->
    <g>
      <rect x="-172" y="52" width="5" height="38" fill="url(#goldPinLead)" stroke="#713f12" stroke-width="0.8"/>
      <rect x="-148" y="52" width="5" height="38" fill="url(#goldPinLead)" stroke="#713f12" stroke-width="0.8"/>
      <rect x="-124" y="52" width="5" height="38" fill="url(#goldPinLead)" stroke="#713f12" stroke-width="0.8"/>
      <rect x="-100" y="52" width="5" height="38" fill="url(#goldPinLead)" stroke="#713f12" stroke-width="0.8"/>
      <rect x="-76" y="52" width="5" height="38" fill="url(#goldPinLead)" stroke="#713f12" stroke-width="0.8"/>
      <rect x="-52" y="52" width="5" height="38" fill="url(#goldPinLead)" stroke="#713f12" stroke-width="0.8"/>
      <rect x="-28" y="52" width="5" height="38" fill="url(#goldPinLead)" stroke="#713f12" stroke-width="0.8"/>
      <rect x="-4" y="52" width="5" height="38" fill="url(#goldPinLead)" stroke="#713f12" stroke-width="0.8"/>
      <rect x="20" y="52" width="5" height="38" fill="url(#goldPinLead)" stroke="#713f12" stroke-width="0.8"/>
      <rect x="44" y="52" width="5" height="38" fill="url(#goldPinLead)" stroke="#713f12" stroke-width="0.8"/>
      <rect x="68" y="52" width="5" height="38" fill="url(#goldPinLead)" stroke="#713f12" stroke-width="0.8"/>
      <rect x="92" y="52" width="5" height="38" fill="url(#goldPinLead)" stroke="#713f12" stroke-width="0.8"/>
      <rect x="116" y="52" width="5" height="38" fill="url(#goldPinLead)" stroke="#713f12" stroke-width="0.8"/>
      <rect x="140" y="52" width="5" height="38" fill="url(#goldPinLead)" stroke="#713f12" stroke-width="0.8"/>
      <rect x="164" y="52" width="5" height="38" fill="url(#goldPinLead)" stroke="#713f12" stroke-width="0.8"/>
    </g>

    <!-- Main High-Profile Plastic Socket Body (8.5mm Tall) -->
    <rect x="-186" y="-35" width="372" height="90" rx="2" fill="url(#femBodyGrad)" stroke="#475569" stroke-width="1.5"/>

    <!-- Top Bevel Face -->
    <rect x="-186" y="-35" width="372" height="12" fill="#334155" stroke="#64748b" stroke-width="0.8"/>

    <!-- Square Entry Holes for 2.54mm Male Header Pins with Internal Gold Tuning-Fork Contacts -->
    <g>
      <!-- Entry hole 1 -->
      <rect x="-176" y="-31" width="12" height="12" fill="#020617" rx="1"/>
      <rect x="-173" y="-28" width="6" height="6" fill="#facc15"/>
      <!-- Entry hole 2 -->
      <rect x="-152" y="-31" width="12" height="12" fill="#020617" rx="1"/>
      <rect x="-149" y="-28" width="6" height="6" fill="#facc15"/>
      <!-- Entry hole 3 -->
      <rect x="-128" y="-31" width="12" height="12" fill="#020617" rx="1"/>
      <rect x="-125" y="-28" width="6" height="6" fill="#facc15"/>
      <!-- Entry hole 4 -->
      <rect x="-104" y="-31" width="12" height="12" fill="#020617" rx="1"/>
      <rect x="-101" y="-28" width="6" height="6" fill="#facc15"/>
      <!-- Entry hole 5 -->
      <rect x="-80" y="-31" width="12" height="12" fill="#020617" rx="1"/>
      <rect x="-77" y="-28" width="6" height="6" fill="#facc15"/>
      <!-- Entry hole 6 -->
      <rect x="-56" y="-31" width="12" height="12" fill="#020617" rx="1"/>
      <rect x="-53" y="-28" width="6" height="6" fill="#facc15"/>
      <!-- Entry hole 7 -->
      <rect x="-32" y="-31" width="12" height="12" fill="#020617" rx="1"/>
      <rect x="-29" y="-28" width="6" height="6" fill="#facc15"/>
      <!-- Entry hole 8 -->
      <rect x="-8" y="-31" width="12" height="12" fill="#020617" rx="1"/>
      <rect x="-5" y="-28" width="6" height="6" fill="#facc15"/>
      <!-- Entry hole 9 -->
      <rect x="16" y="-31" width="12" height="12" fill="#020617" rx="1"/>
      <rect x="19" y="-28" width="6" height="6" fill="#facc15"/>
      <!-- Entry hole 10 -->
      <rect x="40" y="-31" width="12" height="12" fill="#020617" rx="1"/>
      <rect x="43" y="-28" width="6" height="6" fill="#facc15"/>
      <!-- Entry hole 11 -->
      <rect x="64" y="-31" width="12" height="12" fill="#020617" rx="1"/>
      <rect x="67" y="-28" width="6" height="6" fill="#facc15"/>
      <!-- Entry hole 12 -->
      <rect x="88" y="-31" width="12" height="12" fill="#020617" rx="1"/>
      <rect x="91" y="-28" width="6" height="6" fill="#facc15"/>
      <!-- Entry hole 13 -->
      <rect x="112" y="-31" width="12" height="12" fill="#020617" rx="1"/>
      <rect x="115" y="-28" width="6" height="6" fill="#facc15"/>
      <!-- Entry hole 14 -->
      <rect x="136" y="-31" width="12" height="12" fill="#020617" rx="1"/>
      <rect x="139" y="-28" width="6" height="6" fill="#facc15"/>
      <!-- Entry hole 15 -->
      <rect x="160" y="-31" width="12" height="12" fill="#020617" rx="1"/>
      <rect x="163" y="-28" width="6" height="6" fill="#facc15"/>
    </g>

    <!-- Side Scoring Lines for Segment Separation -->
    <path d="M -164 -23 L -164 55 M -140 -23 L -140 55 M -116 -23 L -116 55 M -92 -23 L -92 55 M -68 -23 L -68 55 M -44 -23 L -44 55 M -20 -23 L -20 55 M 4 -23 L 4 55 M 28 -23 L 28 55 M 52 -23 L 52 55 M 76 -23 L 76 55 M 100 -23 L 100 55 M 124 -23 L 124 55 M 148 -23 L 148 55" stroke="#090d16" stroke-width="1.2"/>
  </g>

  <!-- Tag (Bottom) -->
  <g transform="translate(250, 455)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0f172a" letter-spacing="1">40-PIN FEMALE BERG STRIP SOCKET HEADER</text>
    <text x="0" y="18" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">2.54mm STANDARD SPACING • PHOSPHOR BRONZE CONTACTS</text>
  </g>
</svg>