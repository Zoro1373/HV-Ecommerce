      <rect x="-14" y="56" width="8" height="14" fill="#042f2e"/>
      <rect x="-2" y="54" width="16" height="16" fill="#042f2e"/>
      <text x="0" y="90" text-anchor="middle" font-family="monospace" font-size="8" fill="#99f6e4">NORDA-18650-26</text>
