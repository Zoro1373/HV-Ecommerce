<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradDMEGC29" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <linearGradient id="cellBodyBlue29" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="20%" stop-color="#0284c7"/>
      <stop offset="45%" stop-color="#7dd3fc"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="90%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="metalTerminal29" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="25%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="75%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="softShadowCell29" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bgGradDMEGC29)" rx="16"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>
  <path d="M 250 25 L 250 475 M 25 250 L 475 250" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Soft Contact Drop Shadow -->
  <ellipse cx="250" cy="430" rx="90" ry="18" fill="#0f172a" fill-opacity="0.16" filter="url(#softShadowCell29)"/>

  <!-- Spec Tag (Top Left) -->
  <g transform="translate(25, 30)">
    <rect width="115" height="24" rx="4" fill="#059669" fill-opacity="0.12" stroke="#10b981" stroke-width="1"/>
    <text x="57" y="16" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#047857">⚡ EV GRADE CELL</text>
  </g>

  <!-- Cell Format Badge (Top Right) -->
  <g transform="translate(370, 30)">
    <circle cx="45" cy="45" r="42" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="33" y="22" width="24" height="46" rx="4" fill="#0284c7"/>
    <rect x="39" y="18" width="12" height="4" rx="1" fill="#cbd5e1"/>
    <text x="45" y="102" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#0369a1" letter-spacing="0.5">18650 CYLINDER</text>
  </g>

  <!-- Cylindrical 18650 Battery Cell (3.65V, 2900 mAh) -->
  <g transform="translate(250, 240)">
    <!-- Positive Top Button Terminal -->
    <ellipse cx="0" cy="-145" rx="24" ry="7" fill="url(#metalTerminal29)" stroke="#64748b" stroke-width="1"/>
    <rect x="-24" y="-145" width="48" height="12" fill="url(#metalTerminal29)" stroke="#475569" stroke-width="1"/>
    <ellipse cx="0" cy="-133" rx="24" ry="7" fill="url(#metalTerminal29)" stroke="#94a3b8" stroke-width="1"/>

    <!-- Top Metal Collar & Vent Washer Ring -->
    <ellipse cx="0" cy="-130" rx="65" ry="20" fill="url(#metalTerminal29)" stroke="#64748b" stroke-width="1.5"/>
    <ellipse cx="0" cy="-130" rx="42" ry="13" fill="#1e293b"/>
    <circle cx="-32" cy="-130" r="3" fill="#020617"/>
    <circle cx="0" cy="-139" r="3" fill="#020617"/>
    <circle cx="32" cy="-130" r="3" fill="#020617"/>
    <circle cx="0" cy="-121" r="3" fill="#020617"/>

    <!-- Insulator Crimp Ring -->
    <ellipse cx="0" cy="-124" rx="72" ry="22" fill="#0284c7" stroke="#0369a1" stroke-width="1"/>

    <!-- Main 18650 Cylindrical Body -->
    <rect x="-72" y="-124" width="144" height="280" fill="url(#cellBodyBlue29)" stroke="#0369a1" stroke-width="1"/>

    <!-- Cylinder Sheen Line -->
    <rect x="-10" y="-124" width="24" height="280" fill="#ffffff" fill-opacity="0.18"/>

    <!-- DMEGC Cell Markings -->
    <g transform="translate(0, 10)">
      <text x="0" y="-55" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="900" fill="#ffffff" letter-spacing="2">DMEGC</text>
      <text x="0" y="-30" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#bae6fd">INR18650-29E</text>
      <line x1="-50" y1="-18" x2="50" y2="-18" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
      <text x="0" y="2" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">3.65V • 2900 mAh</text>
      <text x="0" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#34d399" letter-spacing="1">EV GRADE CELL</text>
      <rect x="-18" y="38" width="36" height="36" fill="#ffffff" rx="2"/>
      <rect x="-14" y="42" width="10" height="10" fill="#0f172a"/>
      <rect x="0" y="42" width="14" height="8" fill="#0f172a"/>
      <rect x="-14" y="56" width="8" height="14" fill="#0f172a"/>
      <rect x="-2" y="54" width="16" height="16" fill="#0f172a"/>
      <text x="0" y="90" text-anchor="middle" font-family="monospace" font-size="8" fill="#bae6fd">DMEGC-EV-2900</text>
    </g>

    <!-- Bottom Rim & Negative Flat Terminal Base -->
    <ellipse cx="0" cy="156" rx="72" ry="22" fill="url(#metalTerminal29)" stroke="#64748b" stroke-width="1.5"/>
  </g>

  <!-- Tag (Bottom) -->
  <g transform="translate(250, 455)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0f172a" letter-spacing="1">DMEGC 18650 LITHIUM-ION CELL</text>
    <text x="0" y="18" text-anchor="middle" font-family="monospace" font-size="10" fill="#0284c7">3.65V • 2900 mAh • HIGH ENERGY DENSITY</text>
  </g>
</svg>