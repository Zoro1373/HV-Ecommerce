<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradMaleBerg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <linearGradient id="bergBaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="goldPinVertical" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#eab308"/>
      <stop offset="85%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <filter id="softShadowBerg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bgGradMaleBerg)" rx="16"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>
  <path d="M 250 25 L 250 475 M 25 250 L 475 250" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Soft Contact Drop Shadow -->
  <ellipse cx="250" cy="415" rx="155" ry="18" fill="#0f172a" fill-opacity="0.16" filter="url(#softShadowBerg)"/>

  <!-- Spec Tag (Top Left) -->
  <g transform="translate(25, 30)">
    <rect width="135" height="24" rx="4" fill="#0f172a" fill-opacity="0.06" stroke="#cbd5e1" stroke-width="1"/>
    <text x="67" y="16" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#0284c7">2.54mm PITCH / 40P</text>
  </g>

  <!-- Component Badge (Top Right) -->
  <g transform="translate(370, 30)">
    <circle cx="45" cy="45" r="42" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="25" y="42" width="40" height="14" rx="1" fill="#1e293b"/>
    <line x1="30" y1="26" x2="30" y2="64" stroke="#eab308" stroke-width="2.5"/>
    <line x1="38" y1="26" x2="38" y2="64" stroke="#eab308" stroke-width="2.5"/>
    <line x1="46" y1="26" x2="46" y2="64" stroke="#eab308" stroke-width="2.5"/>
    <line x1="54" y1="26" x2="54" y2="64" stroke="#eab308" stroke-width="2.5"/>
    <line x1="62" y1="26" x2="62" y2="64" stroke="#eab308" stroke-width="2.5"/>
    <text x="45" y="102" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="0.5">MALE PIN</text>
  </g>

  <!-- 40-Pin Male Berg Strip (Perspective view showcasing insulator blocks and gold square pins) -->
  <g transform="translate(250, 240) rotate(-14)">
    <!-- Lower Tail Pins (PCB Solder Leads Extending Below Housing) -->
    <g>
      <rect x="-174" y="32" width="6" height="52" fill="url(#goldPinVertical)" stroke="#713f12" stroke-width="0.8"/>
      <rect x="-150" y="32" width="6" height="52" fill="url(#goldPinVertical)" stroke="#713f12" stroke-width="0.8"/>
      <rect x="-126" y="32" width="6" height="52" fill="url(#goldPinVertical)" stroke="#713f12" stroke-width="0.8"/>
      <rect x="-102" y="32" width="6" height="52" fill="url(#goldPinVertical)" stroke="#713f12" stroke-width="0.8"/>
      <rect x="-78" y="32" width="6" height="52" fill="url(#goldPinVertical)" stroke="#713f12" stroke-width="0.8"/>
      <rect x="-54" y="32" width="6" height="52" fill="url(#goldPinVertical)" stroke="#713f12" stroke-width="0.8"/>
      <rect x="-30" y="32" width="6" height="52" fill="url(#goldPinVertical)" stroke="#713f12" stroke-width="0.8"/>
      <rect x="-6" y="32" width="6" height="52" fill="url(#goldPinVertical)" stroke="#713f12" stroke-width="0.8"/>
      <rect x="18" y="32" width="6" height="52" fill="url(#goldPinVertical)" stroke="#713f12" stroke-width="0.8"/>
      <rect x="42" y="32" width="6" height="52" fill="url(#goldPinVertical)" stroke="#713f12" stroke-width="0.8"/>
      <rect x="66" y="32" width="6" height="52" fill="url(#goldPinVertical)" stroke="#713f12" stroke-width="0.8"/>
      <rect x="90" y="32" width="6" height="52" fill="url(#goldPinVertical)" stroke="#713f12" stroke-width="0.8"/>
      <rect x="114" y="32" width="6" height="52" fill="url(#goldPinVertical)" stroke="#713f12" stroke-width="0.8"/>
      <rect x="138" y="32" width="6" height="52" fill="url(#goldPinVertical)" stroke="#713f12" stroke-width="0.8"/>
      <rect x="162" y="32" width="6" height="52" fill="url(#goldPinVertical)" stroke="#713f12" stroke-width="0.8"/>
    </g>

    <!-- Black PBT Plastic Spacer Base with Breakable V-Notches -->
    <rect x="-186" y="0" width="372" height="32" rx="2" fill="url(#bergBaseGrad)" stroke="#475569" stroke-width="1.5"/>
    <!-- Individual Modular Segments & Breakable Snip Notches -->
    <path d="M -162 0 L -162 32 M -138 0 L -138 32 M -114 0 L -114 32 M -90 0 L -90 32 M -66 0 L -66 32 M -42 0 L -42 32 M -18 0 L -18 32 M 6 0 L 6 32 M 30 0 L 30 32 M 54 0 L 54 32 M 78 0 L 78 32 M 102 0 L 102 32 M 126 0 L 126 32 M 150 0 L 150 32" stroke="#090d16" stroke-width="2"/>
    <path d="M -186 2 L 186 2" stroke="#64748b" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Upper Gold-Plated Square Mating Pins (Extending 6.0mm Up) -->
    <g>
      <rect x="-174" y="-88" width="6" height="88" fill="url(#goldPinVertical)" stroke="#713f12" stroke-width="0.8"/>
      <polygon points="-174,-88 -171,-94 -168,-88" fill="#fef08a"/>

      <rect x="-150" y="-88" width="6" height="88" fill="url(#goldPinVertical)" stroke="#713f12" stroke-width="0.8"/>
      <polygon points="-150,-88 -147,-94 -144,-88" fill="#fef08a"/>

      <rect x="-126" y="-88" width="6" height="88" fill="url(#goldPinVertical)" stroke="#713f12" stroke-width="0.8"/>
      <polygon points="-126,-88 -123,-94 -120,-88" fill="#fef08a"/>

      <rect x="-102" y="-88" width="6" height="88" fill="url(#goldPinVertical)" stroke="#713f12" stroke-width="0.8"/>
      <polygon points="-102,-88 -99,-94 -96,-88" fill="#fef08a"/>

      <rect x="-78" y="-88" width="6" height="88" fill="url(#goldPinVertical)" stroke="#713f12" stroke-width="0.8"/>
      <polygon points="-78,-88 -75,-94 -72,-88" fill="#fef08a"/>

      <rect x="-54" y="-88" width="6" height="88" fill="url(#goldPinVertical)" stroke="#713f12" stroke-width="0.8"/>
      <polygon points="-54,-88 -51,-94 -48,-88" fill="#fef08a"/>

      <rect x="-30" y="-88" width="6" height="88" fill="url(#goldPinVertical)" stroke="#713f12" stroke-width="0.8"/>
      <polygon points="-30,-88 -27,-94 -24,-88" fill="#fef08a"/>

      <rect x="-6" y="-88" width="6" height="88" fill="url(#goldPinVertical)" stroke="#713f12" stroke-width="0.8"/>
      <polygon points="-6,-88 -3,-94 0,-88" fill="#fef08a"/>

      <rect x="18" y="-88" width="6" height="88" fill="url(#goldPinVertical)" stroke="#713f12" stroke-width="0.8"/>
      <polygon points="18,-88 21,-94 24,-88" fill="#fef08a"/>

      <rect x="42" y="-88" width="6" height="88" fill="url(#goldPinVertical)" stroke="#713f12" stroke-width="0.8"/>
      <polygon points="42,-88 45,-94 48,-88" fill="#fef08a"/>

      <rect x="66" y="-88" width="6" height="88" fill="url(#goldPinVertical)" stroke="#713f12" stroke-width="0.8"/>
      <polygon points="66,-88 69,-94 72,-88" fill="#fef08a"/>

      <rect x="90" y="-88" width="6" height="88" fill="url(#goldPinVertical)" stroke="#713f12" stroke-width="0.8"/>
      <polygon points="90,-88 93,-94 96,-88" fill="#fef08a"/>

      <rect x="114" y="-88" width="6" height="88" fill="url(#goldPinVertical)" stroke="#713f12" stroke-width="0.8"/>
      <polygon points="114,-88 117,-94 120,-88" fill="#fef08a"/>

      <rect x="138" y="-88" width="6" height="88" fill="url(#goldPinVertical)" stroke="#713f12" stroke-width="0.8"/>
      <polygon points="138,-88 141,-94 144,-88" fill="#fef08a"/>

      <rect x="162" y="-88" width="6" height="88" fill="url(#goldPinVertical)" stroke="#713f12" stroke-width="0.8"/>
      <polygon points="162,-88 165,-94 168,-88" fill="#fef08a"/>
    </g>
  </g>

  <!-- Tag (Bottom) -->
  <g transform="translate(250, 455)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0f172a" letter-spacing="1">40-PIN MALE BERG STRIP PIN HEADER</text>
    <text x="0" y="18" text-anchor="middle" font-family="monospace" font-size="10" fill="#ca8a04">2.54mm STANDARD SPACING • GOLD-FLASH SQUARE PINS</text>
  </g>
</svg>