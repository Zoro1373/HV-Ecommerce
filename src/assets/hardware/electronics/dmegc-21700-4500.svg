<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradDMEGC21" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <linearGradient id="cellBodyBlue21" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="20%" stop-color="#2563eb"/>
      <stop offset="45%" stop-color="#93c5fd"/>
      <stop offset="70%" stop-color="#1d4ed8"/>
      <stop offset="90%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="metalTerminal21" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="25%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="75%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="softShadowCell21" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bgGradDMEGC21)" rx="16"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>
  <path d="M 250 25 L 250 475 M 25 250 L 475 250" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Soft Contact Drop Shadow (Wider for 21700 format) -->
  <ellipse cx="250" cy="435" rx="105" ry="20" fill="#0f172a" fill-opacity="0.16" filter="url(#softShadowCell21)"/>

  <!-- Spec Tag (Top Left) -->
  <g transform="translate(25, 30)">
    <rect width="120" height="24" rx="4" fill="#059669" fill-opacity="0.12" stroke="#10b981" stroke-width="1"/>
    <text x="60" y="16" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#047857">⚡ 21700 EV GRADE</text>
  </g>

  <!-- Cell Format Badge (Top Right) -->
  <g transform="translate(370, 30)">
    <circle cx="45" cy="45" r="42" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="30" y="20" width="30" height="50" rx="4" fill="#1d4ed8"/>
    <rect x="38" y="15" width="14" height="5" rx="1.5" fill="#cbd5e1"/>
    <text x="45" y="102" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#1e3a8a" letter-spacing="0.5">21700 FORMAT</text>
  </g>

  <!-- Cylindrical 21700 Heavy-Duty Battery Cell (3.65V, 4500 mAh) - Note: 21mm wide x 70mm tall proportions -->
  <g transform="translate(250, 240)">
    <!-- Positive Top Button Terminal -->
    <ellipse cx="0" cy="-155" rx="28" ry="8" fill="url(#metalTerminal21)" stroke="#64748b" stroke-width="1"/>
    <rect x="-28" y="-155" width="56" height="14" fill="url(#metalTerminal21)" stroke="#475569" stroke-width="1"/>
    <ellipse cx="0" cy="-141" rx="28" ry="8" fill="url(#metalTerminal21)" stroke="#94a3b8" stroke-width="1"/>

    <!-- Top Metal Collar & Vent Washer Ring -->
    <ellipse cx="0" cy="-136" rx="76" ry="24" fill="url(#metalTerminal21)" stroke="#64748b" stroke-width="1.5"/>
    <ellipse cx="0" cy="-136" rx="50" ry="15" fill="#1e293b"/>
    <circle cx="-38" cy="-136" r="3.5" fill="#020617"/>
    <circle cx="0" cy="-146" r="3.5" fill="#020617"/>
    <circle cx="38" cy="-136" r="3.5" fill="#020617"/>
    <circle cx="0" cy="-126" r="3.5" fill="#020617"/>

    <!-- Insulator Crimp Ring -->
    <ellipse cx="0" cy="-130" rx="84" ry="26" fill="#1e40af" stroke="#0f172a" stroke-width="1"/>

    <!-- Main 21700 Cylindrical Body (Wider Diameter: 168px wide) -->
    <rect x="-84" y="-130" width="168" height="295" fill="url(#cellBodyBlue21)" stroke="#1e3a8a" stroke-width="1"/>

    <!-- Specular Sheen Highlight Line -->
    <rect x="-12" y="-130" width="28" height="295" fill="#ffffff" fill-opacity="0.2"/>

    <!-- DMEGC 21700 Cell Markings -->
    <g transform="translate(0, 15)">
      <text x="0" y="-60" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="2.5">DMEGC</text>
      <text x="0" y="-32" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#bfdbfe">INR21700-45E</text>
      <line x1="-60" y1="-20" x2="60" y2="-20" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.6"/>
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff">3.65V • 4500 mAh</text>
      <text x="0" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#34d399" letter-spacing="1">AUTOMOTIVE EV GRADE</text>
      <!-- 2D Data Matrix Code -->
      <rect x="-20" y="42" width="40" height="40" fill="#ffffff" rx="2"/>
      <rect x="-16" y="46" width="14" height="14" fill="#0f172a"/>
      <rect x="2" y="46" width="14" height="8" fill="#0f172a"/>
      <rect x="-16" y="64" width="8" height="14" fill="#0f172a"/>
      <rect x="-4" y="58" width="10" height="10" fill="#0f172a"/>
      <rect x="8" y="64" width="8" height="14" fill="#0f172a"/>
      <text x="0" y="100" text-anchor="middle" font-family="monospace" font-size="9" fill="#93c5fd">DMEGC-21700-45E</text>
    </g>

    <!-- Bottom Rim & Negative Flat Terminal Base -->
    <ellipse cx="0" cy="165" rx="84" ry="26" fill="url(#metalTerminal21)" stroke="#64748b" stroke-width="1.5"/>
  </g>

  <!-- Tag (Bottom) -->
  <g transform="translate(250, 455)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0f172a" letter-spacing="1">DMEGC 21700 HIGH-CAPACITY CELL</text>
    <text x="0" y="18" text-anchor="middle" font-family="monospace" font-size="10" fill="#1d4ed8">3.65V • 4500 mAh • COMMERCIAL MOBILITY GRADE</text>
  </g>
</svg>