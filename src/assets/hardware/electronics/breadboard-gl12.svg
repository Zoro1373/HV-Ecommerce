<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradBB" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <linearGradient id="bbWhiteBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="softShadowBB" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bgGradBB)" rx="16"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>
  <path d="M 250 25 L 250 475 M 25 250 L 475 250" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Soft Contact Drop Shadow -->
  <ellipse cx="250" cy="425" rx="160" ry="24" fill="#0f172a" fill-opacity="0.16" filter="url(#softShadowBB)"/>

  <!-- Spec Tag (Top Left) -->
  <g transform="translate(25, 30)">
    <rect width="130" height="24" rx="4" fill="#0f172a" fill-opacity="0.06" stroke="#cbd5e1" stroke-width="1"/>
    <text x="65" y="16" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#0284c7">840 TIE-POINTS</text>
  </g>

  <!-- Component Badge (Top Right) -->
  <g transform="translate(370, 30)">
    <circle cx="45" cy="45" r="42" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="22" y="28" width="46" height="34" rx="2" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <line x1="22" y1="32" x2="68" y2="32" stroke="#ef4444" stroke-width="2"/>
    <line x1="22" y1="58" x2="68" y2="58" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="35" cy="45" r="2" fill="#1e293b"/>
    <circle cx="45" cy="45" r="2" fill="#1e293b"/>
    <circle cx="55" cy="45" r="2" fill="#1e293b"/>
    <text x="45" y="102" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="0.5">GL-12 BOARD</text>
  </g>

  <!-- GL-12 840-Point Breadboard 3D Isometric Body -->
  <g transform="translate(250, 240)">
    <!-- Base 3D Thickness Side -->
    <rect x="-175" y="-120" width="350" height="240" rx="8" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Top Face of Breadboard -->
    <rect x="-175" y="-128" width="350" height="236" rx="8" fill="url(#bbWhiteBody)" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Left & Right Power Rails Red & Blue Indicator Lines -->
    <!-- Top Power Rails -->
    <line x1="-155" y1="-110" x2="155" y2="-110" stroke="#ef4444" stroke-width="2.5"/>
    <text x="-165" y="-107" font-family="monospace" font-size="12" font-weight="bold" fill="#ef4444">+</text>
    <text x="160" y="-107" font-family="monospace" font-size="12" font-weight="bold" fill="#ef4444">+</text>

    <line x1="-155" y1="-95" x2="155" y2="-95" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="-165" y="-92" font-family="monospace" font-size="14" font-weight="bold" fill="#3b82f6">-</text>
    <text x="160" y="-92" font-family="monospace" font-size="14" font-weight="bold" fill="#3b82f6">-</text>

    <!-- Center DIP IC Isolation Groove / Trough -->
    <rect x="-160" y="-12" width="320" height="12" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="0" y="-2" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="bold" fill="#94a3b8" letter-spacing="2">GL-12 840 TIE POINTS</text>

    <!-- Bottom Power Rails -->
    <line x1="-155" y1="80" x2="155" y2="80" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="-165" y="83" font-family="monospace" font-size="14" font-weight="bold" fill="#3b82f6">-</text>
    <text x="160" y="83" font-family="monospace" font-size="14" font-weight="bold" fill="#3b82f6">-</text>

    <line x1="-155" y1="95" x2="155" y2="95" stroke="#ef4444" stroke-width="2.5"/>
    <text x="-165" y="98" font-family="monospace" font-size="12" font-weight="bold" fill="#ef4444">+</text>
    <text x="160" y="98" font-family="monospace" font-size="12" font-weight="bold" fill="#ef4444">+</text>

    <!-- Array of Precision Spring Clip Tie-Point Holes -->
    <!-- Pattern of 5-point terminal strips -->
    <g fill="#0f172a" opacity="0.75">
      <!-- Upper Section (Rows A, B, C, D, E) -->
      <!-- Sample of columns across board -->
      <g transform="translate(-140, -80)">
        <!-- 15 Column Samples representing 60 columns -->
        <!-- Y rows: 0, 12, 24, 36, 48 -->
        <circle cx="0" cy="0" r="2.2"/><circle cx="0" cy="12" r="2.2"/><circle cx="0" cy="24" r="2.2"/><circle cx="0" cy="36" r="2.2"/><circle cx="0" cy="48" r="2.2"/>
        <circle cx="20" cy="0" r="2.2"/><circle cx="20" cy="12" r="2.2"/><circle cx="20" cy="24" r="2.2"/><circle cx="20" cy="36" r="2.2"/><circle cx="20" cy="48" r="2.2"/>
        <circle cx="40" cy="0" r="2.2"/><circle cx="40" cy="12" r="2.2"/><circle cx="40" cy="24" r="2.2"/><circle cx="40" cy="36" r="2.2"/><circle cx="40" cy="48" r="2.2"/>
        <circle cx="60" cy="0" r="2.2"/><circle cx="60" cy="12" r="2.2"/><circle cx="60" cy="24" r="2.2"/><circle cx="60" cy="36" r="2.2"/><circle cx="60" cy="48" r="2.2"/>
        <circle cx="80" cy="0" r="2.2"/><circle cx="80" cy="12" r="2.2"/><circle cx="80" cy="24" r="2.2"/><circle cx="80" cy="36" r="2.2"/><circle cx="80" cy="48" r="2.2"/>
        <circle cx="100" cy="0" r="2.2"/><circle cx="100" cy="12" r="2.2"/><circle cx="100" cy="24" r="2.2"/><circle cx="100" cy="36" r="2.2"/><circle cx="100" cy="48" r="2.2"/>
        <circle cx="120" cy="0" r="2.2"/><circle cx="120" cy="12" r="2.2"/><circle cx="120" cy="24" r="2.2"/><circle cx="120" cy="36" r="2.2"/><circle cx="120" cy="48" r="2.2"/>
        <circle cx="140" cy="0" r="2.2"/><circle cx="140" cy="12" r="2.2"/><circle cx="140" cy="24" r="2.2"/><circle cx="140" cy="36" r="2.2"/><circle cx="140" cy="48" r="2.2"/>
        <circle cx="160" cy="0" r="2.2"/><circle cx="160" cy="12" r="2.2"/><circle cx="160" cy="24" r="2.2"/><circle cx="160" cy="36" r="2.2"/><circle cx="160" cy="48" r="2.2"/>
        <circle cx="180" cy="0" r="2.2"/><circle cx="180" cy="12" r="2.2"/><circle cx="180" cy="24" r="2.2"/><circle cx="180" cy="36" r="2.2"/><circle cx="180" cy="48" r="2.2"/>
        <circle cx="200" cy="0" r="2.2"/><circle cx="200" cy="12" r="2.2"/><circle cx="200" cy="24" r="2.2"/><circle cx="200" cy="36" r="2.2"/><circle cx="200" cy="48" r="2.2"/>
        <circle cx="220" cy="0" r="2.2"/><circle cx="220" cy="12" r="2.2"/><circle cx="220" cy="24" r="2.2"/><circle cx="220" cy="36" r="2.2"/><circle cx="220" cy="48" r="2.2"/>
        <circle cx="240" cy="0" r="2.2"/><circle cx="240" cy="12" r="2.2"/><circle cx="240" cy="24" r="2.2"/><circle cx="240" cy="36" r="2.2"/><circle cx="240" cy="48" r="2.2"/>
        <circle cx="260" cy="0" r="2.2"/><circle cx="260" cy="12" r="2.2"/><circle cx="260" cy="24" r="2.2"/><circle cx="260" cy="36" r="2.2"/><circle cx="260" cy="48" r="2.2"/>
        <circle cx="280" cy="0" r="2.2"/><circle cx="280" cy="12" r="2.2"/><circle cx="280" cy="24" r="2.2"/><circle cx="280" cy="36" r="2.2"/><circle cx="280" cy="48" r="2.2"/>
      </g>

      <!-- Lower Section (Rows F, G, H, I, J) -->
      <g transform="translate(-140, 15)">
        <circle cx="0" cy="0" r="2.2"/><circle cx="0" cy="12" r="2.2"/><circle cx="0" cy="24" r="2.2"/><circle cx="0" cy="36" r="2.2"/><circle cx="0" cy="48" r="2.2"/>
        <circle cx="20" cy="0" r="2.2"/><circle cx="20" cy="12" r="2.2"/><circle cx="20" cy="24" r="2.2"/><circle cx="20" cy="36" r="2.2"/><circle cx="20" cy="48" r="2.2"/>
        <circle cx="40" cy="0" r="2.2"/><circle cx="40" cy="12" r="2.2"/><circle cx="40" cy="24" r="2.2"/><circle cx="40" cy="36" r="2.2"/><circle cx="40" cy="48" r="2.2"/>
        <circle cx="60" cy="0" r="2.2"/><circle cx="60" cy="12" r="2.2"/><circle cx="60" cy="24" r="2.2"/><circle cx="60" cy="36" r="2.2"/><circle cx="60" cy="48" r="2.2"/>
        <circle cx="80" cy="0" r="2.2"/><circle cx="80" cy="12" r="2.2"/><circle cx="80" cy="24" r="2.2"/><circle cx="80" cy="36" r="2.2"/><circle cx="80" cy="48" r="2.2"/>
        <circle cx="100" cy="0" r="2.2"/><circle cx="100" cy="12" r="2.2"/><circle cx="100" cy="24" r="2.2"/><circle cx="100" cy="36" r="2.2"/><circle cx="100" cy="48" r="2.2"/>
        <circle cx="120" cy="0" r="2.2"/><circle cx="120" cy="12" r="2.2"/><circle cx="120" cy="24" r="2.2"/><circle cx="120" cy="36" r="2.2"/><circle cx="120" cy="48" r="2.2"/>
        <circle cx="140" cy="0" r="2.2"/><circle cx="140" cy="12" r="2.2"/><circle cx="140" cy="24" r="2.2"/><circle cx="140" cy="36" r="2.2"/><circle cx="140" cy="48" r="2.2"/>
        <circle cx="160" cy="0" r="2.2"/><circle cx="160" cy="12" r="2.2"/><circle cx="160" cy="24" r="2.2"/><circle cx="160" cy="36" r="2.2"/><circle cx="160" cy="48" r="2.2"/>
        <circle cx="180" cy="0" r="2.2"/><circle cx="180" cy="12" r="2.2"/><circle cx="180" cy="24" r="2.2"/><circle cx="180" cy="36" r="2.2"/><circle cx="180" cy="48" r="2.2"/>
        <circle cx="200" cy="0" r="2.2"/><circle cx="200" cy="12" r="2.2"/><circle cx="200" cy="24" r="2.2"/><circle cx="200" cy="36" r="2.2"/><circle cx="200" cy="48" r="2.2"/>
        <circle cx="220" cy="0" r="2.2"/><circle cx="220" cy="12" r="2.2"/><circle cx="220" cy="24" r="2.2"/><circle cx="220" cy="36" r="2.2"/><circle cx="220" cy="48" r="2.2"/>
        <circle cx="240" cy="0" r="2.2"/><circle cx="240" cy="12" r="2.2"/><circle cx="240" cy="24" r="2.2"/><circle cx="240" cy="36" r="2.2"/><circle cx="240" cy="48" r="2.2"/>
        <circle cx="260" cy="0" r="2.2"/><circle cx="260" cy="12" r="2.2"/><circle cx="260" cy="24" r="2.2"/><circle cx="260" cy="36" r="2.2"/><circle cx="260" cy="48" r="2.2"/>
        <circle cx="280" cy="0" r="2.2"/><circle cx="280" cy="12" r="2.2"/><circle cx="280" cy="24" r="2.2"/><circle cx="280" cy="36" r="2.2"/><circle cx="280" cy="48" r="2.2"/>
      </g>
    </g>
  </g>

  <!-- Tag (Bottom) -->
  <g transform="translate(250, 455)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0f172a" letter-spacing="1">GL-12 840-POINT SOLDERLESS BREADBOARD</text>
    <text x="0" y="18" text-anchor="middle" font-family="monospace" font-size="10" fill="#0284c7">2.54mm STANDARD TIE-POINT MATRIX • TWIN POWER BUS RAILS</text>
  </g>
</svg>