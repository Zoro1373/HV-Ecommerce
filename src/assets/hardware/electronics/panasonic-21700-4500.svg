<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradPana" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <!-- Classic Panasonic Industrial Green Sleeve Gradient -->
    <linearGradient id="cellBodyPana" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="20%" stop-color="#22c55e"/>
      <stop offset="45%" stop-color="#bbf7d0"/>
      <stop offset="70%" stop-color="#16a34a"/>
      <stop offset="90%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="metalTerminalPana" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="25%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="75%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="softShadowPana" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bgGradPana)" rx="16"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>
  <path d="M 250 25 L 250 475 M 25 250 L 475 250" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Soft Contact Drop Shadow -->
  <ellipse cx="250" cy="435" rx="105" ry="20" fill="#0f172a" fill-opacity="0.16" filter="url(#softShadowPana)"/>

  <!-- Spec Tag (Top Left) -->
  <g transform="translate(25, 30)">
    <rect width="135" height="24" rx="4" fill="#15803d" fill-opacity="0.12" stroke="#22c55e" stroke-width="1"/>
    <text x="67" y="16" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#15803d">GENUINE PANASONIC</text>
  </g>

  <!-- Cell Format Badge (Top Right) -->
  <g transform="translate(370, 30)">
    <circle cx="45" cy="45" r="42" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect x="30" y="20" width="30" height="50" rx="4" fill="#16a34a"/>
    <rect x="38" y="15" width="14" height="5" rx="1.5" fill="#cbd5e1"/>
    <text x="45" y="102" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#15803d" letter-spacing="0.5">NCR 21700</text>
  </g>

  <!-- Cylindrical Panasonic 21700 Cell (4500 mAh) -->
  <g transform="translate(250, 240)">
    <ellipse cx="0" cy="-155" rx="28" ry="8" fill="url(#metalTerminalPana)" stroke="#64748b" stroke-width="1"/>
    <rect x="-28" y="-155" width="56" height="14" fill="url(#metalTerminalPana)" stroke="#475569" stroke-width="1"/>
    <ellipse cx="0" cy="-141" rx="28" ry="8" fill="url(#metalTerminalPana)" stroke="#94a3b8" stroke-width="1"/>

    <ellipse cx="0" cy="-136" rx="76" ry="24" fill="url(#metalTerminalPana)" stroke="#64748b" stroke-width="1.5"/>
    <ellipse cx="0" cy="-136" rx="50" ry="15" fill="#1e293b"/>
    <circle cx="-38" cy="-136" r="3.5" fill="#020617"/>
    <circle cx="0" cy="-146" r="3.5" fill="#020617"/>
    <circle cx="38" cy="-136" r="3.5" fill="#020617"/>
    <circle cx="0" cy="-126" r="3.5" fill="#020617"/>

    <ellipse cx="0" cy="-130" rx="84" ry="26" fill="#166534" stroke="#14532d" stroke-width="1"/>

    <!-- Main 21700 Cylindrical Body -->
    <rect x="-84" y="-130" width="168" height="295" fill="url(#cellBodyPana)" stroke="#15803d" stroke-width="1"/>
    <rect x="-12" y="-130" width="28" height="295" fill="#ffffff" fill-opacity="0.2"/>

    <!-- Panasonic Cell Markings -->
    <g transform="translate(0, 15)">
      <text x="0" y="-60" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="2">Panasonic</text>
      <text x="0" y="-32" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#dcfce7">NCR21700A</text>
      <line x1="-60" y1="-20" x2="60" y2="-20" stroke="#86efac" stroke-width="1.5" stroke-opacity="0.6"/>
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff">3.7V • 4500 mAh</text>
      <text x="0" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#ffffff" letter-spacing="1">MADE IN JAPAN</text>
      <rect x="-20" y="42" width="40" height="40" fill="#ffffff" rx="2"/>
      <rect x="-16" y="46" width="10" height="10" fill="#14532d"/>
      <rect x="-2" y="46" width="18" height="12" fill="#14532d"/>
      <rect x="-16" y="60" width="14" height="18" fill="#14532d"/>
      <rect x="2" y="62" width="14" height="16" fill="#14532d"/>
      <text x="0" y="100" text-anchor="middle" font-family="monospace" font-size="9" fill="#bbf7d0">NCR-21700-4500</text>
    </g>

    <ellipse cx="0" cy="165" rx="84" ry="26" fill="url(#metalTerminalPana)" stroke="#64748b" stroke-width="1.5"/>
  </g>

  <!-- Tag (Bottom) -->
  <g transform="translate(250, 455)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0f172a" letter-spacing="1">PANASONIC NMC CELL 21700</text>
    <text x="0" y="18" text-anchor="middle" font-family="monospace" font-size="10" fill="#16a34a">VERIFIED 4500 mAh • PREMIUM AUTOMOTIVE TIER-1</text>
  </g>
</svg>