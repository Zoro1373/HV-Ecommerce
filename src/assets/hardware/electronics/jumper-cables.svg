<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradJumper" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <linearGradient id="housingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="35%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldPinGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="softShadowJumper" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bgGradJumper)" rx="16"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>
  <path d="M 250 25 L 250 475 M 25 250 L 475 250" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Soft Contact Drop Shadow -->
  <ellipse cx="250" cy="415" rx="145" ry="24" fill="#0f172a" fill-opacity="0.14" filter="url(#softShadowJumper)"/>

  <!-- Spec Tag (Top Left) -->
  <g transform="translate(25, 30)">
    <rect width="130" height="24" rx="4" fill="#0f172a" fill-opacity="0.06" stroke="#cbd5e1" stroke-width="1"/>
    <text x="65" y="16" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#0284c7">24 AWG RIBBON</text>
  </g>

  <!-- Component Badge (Top Right) -->
  <g transform="translate(370, 30)">
    <circle cx="45" cy="45" r="42" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 25 35 Q 45 60 65 35" fill="none" stroke="#ef4444" stroke-width="4"/>
    <path d="M 25 45 Q 45 70 65 45" fill="none" stroke="#3b82f6" stroke-width="4"/>
    <path d="M 25 55 Q 45 80 65 55" fill="none" stroke="#eab308" stroke-width="4"/>
    <text x="45" y="102" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="0.5">DUPONT CABLE</text>
  </g>

  <!-- 40-Pin Multi-Colored Flexible Rainbow Ribbon Jumper Cables -->
  <g transform="translate(250, 240)">
    <!-- Sweeping Multi-Colored Cable Strands (Rainbow Flexible Ribbon) -->
    <path d="M -150 -60 C -100 80, 100 80, 150 -60" fill="none" stroke="#ef4444" stroke-width="10" stroke-linecap="round"/>
    <path d="M -145 -48 C -95 90, 95 90, 145 -48" fill="none" stroke="#f97316" stroke-width="10" stroke-linecap="round"/>
    <path d="M -140 -36 C -90 100, 90 100, 140 -36" fill="none" stroke="#eab308" stroke-width="10" stroke-linecap="round"/>
    <path d="M -135 -24 C -85 110, 85 110, 135 -24" fill="none" stroke="#22c55e" stroke-width="10" stroke-linecap="round"/>
    <path d="M -130 -12 C -80 120, 80 120, 130 -12" fill="none" stroke="#06b6d4" stroke-width="10" stroke-linecap="round"/>
    <path d="M -125 0 C -75 130, 75 130, 125 0" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round"/>
    <path d="M -120 12 C -70 140, 70 140, 120 12" fill="none" stroke="#8b5cf6" stroke-width="10" stroke-linecap="round"/>
    <path d="M -115 24 C -65 150, 65 150, 115 24" fill="none" stroke="#ec4899" stroke-width="10" stroke-linecap="round"/>
    <path d="M -110 36 C -60 160, 60 160, 110 36" fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
    <path d="M -105 48 C -55 170, 55 170, 105 48" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>

    <!-- Left Termination: Molded 1-Pin Dupont Connector Block Housing -->
    <g transform="translate(-140, -110) rotate(-18)">
      <!-- Strain relief boots -->
      <rect x="-42" y="24" width="84" height="24" rx="3" fill="#0f172a"/>
      <!-- Main Dupont Housings (Black 2.54mm Shells) -->
      <rect x="-44" y="-35" width="88" height="60" rx="3" fill="url(#housingGrad)" stroke="#475569" stroke-width="1.5"/>
      <!-- Housing Grooves / Latch Windows -->
      <rect x="-38" y="-20" width="12" height="15" fill="#020617" rx="1"/>
      <rect x="-20" y="-20" width="12" height="15" fill="#020617" rx="1"/>
      <rect x="-2" y="-20" width="12" height="15" fill="#020617" rx="1"/>
      <rect x="16" y="-20" width="12" height="15" fill="#020617" rx="1"/>
      <!-- Male Gold-Plated Square Pins Extending Out -->
      <rect x="-36" y="-62" width="8" height="28" fill="url(#goldPinGrad)" stroke="#a16207" stroke-width="1"/>
      <rect x="-18" y="-62" width="8" height="28" fill="url(#goldPinGrad)" stroke="#a16207" stroke-width="1"/>
      <rect x="0" y="-62" width="8" height="28" fill="url(#goldPinGrad)" stroke="#a16207" stroke-width="1"/>
      <rect x="18" y="-62" width="8" height="28" fill="url(#goldPinGrad)" stroke="#a16207" stroke-width="1"/>
    </g>

    <!-- Right Termination: Female Socket Dupont Block Housing -->
    <g transform="translate(140, -110) rotate(18)">
      <rect x="-42" y="24" width="84" height="24" rx="3" fill="#0f172a"/>
      <rect x="-44" y="-35" width="88" height="60" rx="3" fill="url(#housingGrad)" stroke="#475569" stroke-width="1.5"/>
      <!-- Female Square Socket Receptacle Holes -->
      <rect x="-38" y="-30" width="12" height="12" fill="#020617" rx="1"/>
      <rect x="-20" y="-30" width="12" height="12" fill="#020617" rx="1"/>
      <rect x="-2" y="-30" width="12" height="12" fill="#020617" rx="1"/>
      <rect x="16" y="-30" width="12" height="12" fill="#020617" rx="1"/>
      <!-- Gold spring clips visible inside female sockets -->
      <rect x="-34" y="-27" width="4" height="6" fill="#facc15"/>
      <rect x="-16" y="-27" width="4" height="6" fill="#facc15"/>
      <rect x="2" y="-27" width="4" height="6" fill="#facc15"/>
      <rect x="20" y="-27" width="4" height="6" fill="#facc15"/>
    </g>
  </g>

  <!-- Tag (Bottom) -->
  <g transform="translate(250, 455)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0f172a" letter-spacing="1">40-PIN MULTICOLOR JUMPER CABLES</text>
    <text x="0" y="18" text-anchor="middle" font-family="monospace" font-size="10" fill="#0284c7">2.54mm STANDARD CONNECTOR HOUSINGS • COPPER CORE</text>
  </g>
</svg>